<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placa Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Consulta de Veículos</h1>
        <label for="placa" class="form-label">
            Placa do veículo
        </label>

        <input type="text" id="placa" class="form-control" placeholder="ABC1D23">
        <button class="btn btn primary" id="btnConsultar">Consultar</button>

        <div class="card mt-4 d-none">
            <div class="card-body">
                <h2 class="card-title">Resultado da consulta</h2>

                <p><strong>Marca:</strong> <span id="marca">-</span></p>
                <p><strong>Modelo:</strong> <span id="modelo">-</span></p>
                <p><strong>Ano:</strong> <span id="ano">-</span></p>
                <p><strong>Cor:</strong> <span id="cor">-</span></p>
                <p><strong>Combustível:</strong> <span id="combustivel">-</span></p>
            </div>
        </div>

    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
