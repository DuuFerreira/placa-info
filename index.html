<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placa Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <main class="w-100" style="max-width: 500px;">
            
            <div class="container py-5">
            <h1 class="mb-4">
                Consulta de Veículos
            </h1>

            <div class="mb-3">
                <label for="placa" class="form-label">
                    Placa do veículo
                </label>

                <div class="placa">
                    <div class="placa-cabecalho">
                        <span>BRASIL </span>
                    </div>

                    <input
                        type="text"
                        id="placa"
                        class="placa-input"
                        placeholder="ABC1D23"
                        maxlength="7"
                        autocomplete="off"
                    >
                </div>
                <div id="mensagem" class="mt-3"></div>
                <div class="d-grid d-sm-flex">
                    <button type="button" class="btn btn-primary" id="btnConsultar">
                        Consultar
                    </button>
                </div>
            </div>
            

            <div id="resultado" class="card mt-4 d-none">
                <div class="card-body">
                    <h2 class="card-title">Resultado da consulta</h2>

                    <p><strong>Marca:</strong> <span id="marca">-</span></p>
                    <p><strong>Modelo:</strong> <span id="modelo">-</span></p>
                    <p><strong>Versão:</strong> <span id="versao">-</span></p>
                    <p><strong>Ano:</strong> <span id="ano">-</span></p>
                    <p><strong>Motor:</strong> <span id="motor">-</span></p>
                    <p><strong>Cambio:</strong> <span id="cambio">-</span></p>
                    <p><strong>Cor:</strong> <span id="cor">-</span></p>
                    <p><strong>Combustível:</strong> <span id="combustivel">-</span></p>
                </div>
            </div>

        </div>

        </main>
    </div>

    
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
