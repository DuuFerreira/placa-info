<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placa Info</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center py-5"
    >
      <main
        class="w-100 bg-white p-4 p-md-5 rounded-4 shadow"
        style="max-width: 500px"
      >
        <h1 class="mb-2 fw-bold">Consulta de Veículos</h1>

        <p class="text-secondary mb-4">
          Consulte informações do veículo pela placa
        </p>

        <div class="mb-3">
          <div class="placa">
            <div class="placa-cabecalho">
              <span>BRASIL </span>
            </div>

            <input
              type="text"
              id="placa"
              class="placa-input"
              placeholder="ABC1D23"
              maxlength="7"
              autocomplete="off"
            />
          </div>
          <div id="mensagem" class="mt-3"></div>
          <div class="d-grid d-sm-flex justify-content-sm-center mt-4">
            <button
              type="button"
              class="btn btn-primary px-4 py-2 fw-semibold"
              id="btnConsultar"
            >
              Consultar
            </button>
          </div>
        </div>

        <div id="resultado" class="card mt-4 d-none border-0 shadow-sm">
          <div class="card-body p-4">
            <h2 class="card-title fs-5 fw-bold mb-4">Resultado da consulta:</h2>

            <div class="row g-3 text-start">
              <div class="col-12">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Placa</small>
                  <strong id="numeroPlaca">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Marca</small>
                  <strong id="marca">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Modelo</small>
                  <strong id="modelo">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Versão</small>
                  <strong id="versao">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Ano</small>
                  <strong id="ano">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Motor</small>
                  <strong id="motor">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Câmbio</small>
                  <strong id="cambio">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Cor</small>
                  <strong id="cor">-</strong>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="resultado-item border rounded-3 p-3">
                  <small class="text-secondary d-block">Combustível</small>
                  <strong id="combustivel">-</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
